<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Summarizer - AI-Powered Text Summarization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.3);
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: none;
        }

        .card.active {
            display: block;
        }

        .input-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-upload {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload-label {
            cursor: pointer;
            color: #666;
        }

        .file-upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .file-name {
            margin-top: 10px;
            color: #667eea;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
            padding: 10px 20px;
            width: auto;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-header h2 {
            color: #333;
            font-size: 1.5rem;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .copy-btn, .export-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .copy-btn:hover, .export-btn:hover {
            background: #5568d3;
        }

        .summary-text {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .metadata {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .metadata-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metadata-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .metadata-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
        }

        .error {
            display: none;
            background: #fee;
            border-left: 4px solid #f44;
            padding: 15px;
            border-radius: 8px;
            color: #c33;
            margin-bottom: 20px;
        }

        .error.active {
            display: block;
        }

        .history-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }

        .history-item:hover {
            background: #e8e9ff;
            transform: translateX(5px);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-date {
            font-size: 0.9rem;
            color: #666;
        }

        .history-style {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .history-preview {
            color: #666;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .metadata {
                grid-template-columns: 1fr;
            }

            .nav-tabs {
                flex-direction: column;
            }

            .nav-tab {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Content Summarizer</h1>
            <p>AI-powered text summarization using Google Gemini</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('summarize')">📝 New Summary</button>
            <button class="nav-tab" onclick="showSection('history')">📚 History</button>
            <button class="nav-tab" onclick="showSection('statistics')">📊 Statistics</button>
        </div>

        <!-- Summarize Section -->
        <div id="summarizeSection" class="card active">
            <div class="input-tabs">
                <button class="tab active" onclick="switchTab('text')">📝 Text Input</button>
                <button class="tab" onclick="switchTab('file')">📄 File Upload</button>
            </div>

            <form id="summarizerForm">
                <!-- Summary Style Selector -->
                <div class="form-group">
                    <label for="summaryStyle">Summary Style:</label>
                    <select id="summaryStyle" name="style">
                        <option value="standard">Standard - Balanced summary</option>
                        <option value="bullet">Bullet Points - Key points list</option>
                        <option value="executive">Executive - Business-focused</option>
                        <option value="academic">Academic - Scholarly style</option>
                        <option value="brief">Brief - Very short summary</option>
                        <option value="detailed">Detailed - Comprehensive summary</option>
                        <option value="social">Social Media - Casual & engaging</option>
                    </select>
                </div>

                <div id="textTab" class="tab-content active">
                    <div class="form-group">
                        <label for="textContent">Enter or paste your text:</label>
                        <textarea 
                            id="textContent" 
                            name="content" 
                            placeholder="Paste your article, blog post, or any long-form content here..."
                        ></textarea>
                    </div>
                </div>

                <div id="fileTab" class="tab-content">
                    <div class="form-group">
                        <label>Upload a text file:</label>
                        <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                            <input type="file" id="fileInput" name="file" accept=".txt,.md" onchange="handleFileSelect(event)">
                            <label class="file-upload-label">
                                <div class="file-upload-icon">📁</div>
                                <div>Click to select a file or drag and drop</div>
                                <div style="font-size: 0.9rem; color: #999; margin-top: 5px;">Supports .txt and .md files</div>
                            </label>
                            <div id="fileName" class="file-name"></div>
                        </div>
                    </div>
                </div>

                <div class="error" id="errorMessage"></div>

                <button type="submit" class="btn" id="submitBtn">
                    🚀 Generate Summary
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating summary...</p>
            </div>
        </div>

        <!-- Result Section -->
        <div class="card result" id="result">
            <div class="result-header">
                <h2>📋 Summary</h2>
                <div class="export-buttons">
                    <button class="copy-btn" onclick="copySummary()">📋 Copy</button>
                    <button class="export-btn" onclick="exportSummary('pdf')">📄 PDF</button>
                    <button class="export-btn" onclick="exportSummary('docx')">📝 Word</button>
                    <button class="export-btn" onclick="exportSummary('md')">📑 Markdown</button>
                    <button class="export-btn" onclick="exportSummary('txt')">📃 Text</button>
                </div>
            </div>
            
            <div class="summary-text" id="summaryText"></div>

            <div class="metadata">
                <div class="metadata-item">
                    <div class="metadata-label">Style</div>
                    <div class="metadata-value" id="summaryStyle">-</div>
                </div>
                <div class="metadata-item">
                    <div class="metadata-label">Original Length</div>
                    <div class="metadata-value" id="originalLength">-</div>
                </div>
                <div class="metadata-item">
                    <div class="metadata-label">Summary Length</div>
                    <div class="metadata-value" id="summaryLength">-</div>
                </div>
                <div class="metadata-item">
                    <div class="metadata-label">Compression</div>
                    <div class="metadata-value" id="compression">-</div>
                </div>
                <div class="metadata-item">
                    <div class="metadata-label">Model Used</div>
                    <div class="metadata-value" id="modelUsed">-</div>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div id="historySection" class="card">
            <h2 style="margin-bottom: 20px;">📚 Summary History</h2>
            <div id="historyList"></div>
            <div class="loading" id="historyLoading">
                <div class="spinner"></div>
                <p>Loading history...</p>
            </div>
        </div>

        <!-- Statistics Section -->
        <div id="statisticsSection" class="card">
            <h2 style="margin-bottom: 20px;">📊 Statistics</h2>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="loading" id="statsLoading">
                <div class="spinner"></div>
                <p>Loading statistics...</p>
            </div>
        </div>

        <div class="footer">
            <p>Powered by Google Gemini AI</p>
        </div>
    </div>

    <script>
        let currentTab = 'text';
        let currentSummaryId = null;

        function showSection(section) {
            // Update nav tabs
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update sections
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(section + 'Section').classList.add('active');
            
            // Load data for specific sections
            if (section === 'history') {
                loadHistory();
            } else if (section === 'statistics') {
                loadStatistics();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            
            // Clear error
            hideError();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = `Selected: ${file.name}`;
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('active');
        }

        function showLoading() {
            document.getElementById('loading').classList.add('active');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('result').classList.remove('active');
            hideError();
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('submitBtn').disabled = false;
        }

        function showResult(data) {
            currentSummaryId = data.summary_id;
            document.getElementById('summaryText').textContent = data.summary;
            document.getElementById('summaryStyle').textContent = data.metadata.style || 'Standard';
            document.getElementById('originalLength').textContent = data.metadata.original_length.toLocaleString() + ' chars';
            document.getElementById('summaryLength').textContent = data.metadata.summary_length.toLocaleString() + ' chars';
            document.getElementById('compression').textContent = data.metadata.compression;
            document.getElementById('modelUsed').textContent = data.metadata.model_used;
            document.getElementById('result').classList.add('active');
            
            // Scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copySummary() {
            const summaryText = document.getElementById('summaryText').textContent;
            navigator.clipboard.writeText(summaryText).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        function exportSummary(format) {
            if (!currentSummaryId) {
                alert('No summary to export');
                return;
            }
            
            window.location.href = `/export/${currentSummaryId}/${format}`;
        }

        async function loadHistory() {
            const historyList = document.getElementById('historyList');
            const loading = document.getElementById('historyLoading');
            
            loading.classList.add('active');
            historyList.innerHTML = '';
            
            try {
                const response = await fetch('/history?limit=20');
                const data = await response.json();
                
                if (data.success && data.summaries.length > 0) {
                    data.summaries.forEach(summary => {
                        const item = document.createElement('div');
                        item.className = 'history-item';
                        item.onclick = () => viewHistoryItem(summary.id);
                        
                        const preview = summary.summary_text.substring(0, 100) + '...';
                        const date = new Date(summary.created_at).toLocaleString();
                        
                        item.innerHTML = `
                            <div class="history-header">
                                <span class="history-date">${date}</span>
                                <span class="history-style">${summary.summary_style}</span>
                            </div>
                            <div class="history-preview">${preview}</div>
                        `;
                        
                        historyList.appendChild(item);
                    });
                } else {
                    historyList.innerHTML = '<p style="text-align: center; color: #666;">No summaries yet. Create your first summary!</p>';
                }
            } catch (error) {
                historyList.innerHTML = '<p style="text-align: center; color: #f44;">Error loading history</p>';
            } finally {
                loading.classList.remove('active');
            }
        }

        async function viewHistoryItem(id) {
            try {
                const response = await fetch(`/history/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    const summary = data.summary;
                    currentSummaryId = summary.id;
                    
                    // Show result
                    document.getElementById('summaryText').textContent = summary.summary_text;
                    document.getElementById('summaryStyle').textContent = summary.summary_style;
                    document.getElementById('originalLength').textContent = summary.original_length.toLocaleString() + ' chars';
                    document.getElementById('summaryLength').textContent = summary.summary_length.toLocaleString() + ' chars';
                    document.getElementById('compression').textContent = summary.compression_rate.toFixed(1) + '%';
                    document.getElementById('modelUsed').textContent = summary.model_used;
                    
                    // Switch to summarize section and show result
                    showSection('summarize');
                    document.getElementById('result').classList.add('active');
                    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                alert('Error loading summary');
            }
        }

        async function loadStatistics() {
            const statsGrid = document.getElementById('statsGrid');
            const loading = document.getElementById('statsLoading');
            
            loading.classList.add('active');
            statsGrid.innerHTML = '';
            
            try {
                const response = await fetch('/statistics');
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.statistics;
                    
                    // Total summaries
                    statsGrid.innerHTML += `
                        <div class="stat-card">
                            <div class="stat-value">${stats.total_summaries}</div>
                            <div class="stat-label">Total Summaries</div>
                        </div>
                    `;
                    
                    // Average compression
                    statsGrid.innerHTML += `
                        <div class="stat-card">
                            <div class="stat-value">${stats.average_compression}%</div>
                            <div class="stat-label">Avg Compression</div>
                        </div>
                    `;
                    
                    // Most used style
                    const styles = stats.by_style;
                    const mostUsed = Object.keys(styles).reduce((a, b) => styles[a] > styles[b] ? a : b, 'standard');
                    statsGrid.innerHTML += `
                        <div class="stat-card">
                            <div class="stat-value">${mostUsed}</div>
                            <div class="stat-label">Most Used Style</div>
                        </div>
                    `;
                }
            } catch (error) {
                statsGrid.innerHTML = '<p style="text-align: center; color: #f44;">Error loading statistics</p>';
            } finally {
                loading.classList.remove('active');
            }
        }

        document.getElementById('summarizerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            showLoading();
            
            const formData = new FormData();
            formData.append('input_method', currentTab);
            formData.append('style', document.getElementById('summaryStyle').value);
            
            if (currentTab === 'text') {
                const content = document.getElementById('textContent').value.trim();
                if (!content) {
                    hideLoading();
                    showError('Please enter some text to summarize.');
                    return;
                }
                formData.append('content', content);
            } else {
                const fileInput = document.getElementById('fileInput');
                if (!fileInput.files.length) {
                    hideLoading();
                    showError('Please select a file to upload.');
                    return;
                }
                formData.append('file', fileInput.files[0]);
            }
            
            try {
                const response = await fetch('/summarize', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(data);
                } else {
                    showError(data.error || 'An error occurred while generating the summary.');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                hideLoading();
            }
        });

        // Drag and drop support
        const fileUpload = document.querySelector('.file-upload');
        
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.style.borderColor = '#667eea';
            fileUpload.style.background = '#f8f9ff';
        });
        
        fileUpload.addEventListener('dragleave', () => {
            fileUpload.style.borderColor = '#e0e0e0';
            fileUpload.style.background = 'white';
        });
        
        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.style.borderColor = '#e0e0e0';
            fileUpload.style.background = 'white';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                handleFileSelect({ target: { files: files } });
            }
        });
    </script>
</body>
</html>
