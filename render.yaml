services:
  - type: web
    name: content-summarizer
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements-deploy.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-flash-latest
      - key: MAX_TOKENS
        value: 1024
      - key: TEMPERATURE
        value: 0.5
